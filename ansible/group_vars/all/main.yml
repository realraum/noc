---
# Build-related directories
global_artifacts_dir: "{{ inventory_dir }}/artifacts"
global_cache_dir: "{{ inventory_dir }}/.cache"

# Directory for static assets
global_files_dir: "{{ inventory_dir }}/files"

# Default credentials
## Root password; by default, undefined
root_password: "{{ vault_root_password }}"
## SSH keys for root, default to NOC's

ssh_users_root: "{{ user_groups.noc }}"

acmetool_account_email: noc@realraum.at

## Legacy ssh algorithms for old hosts, set per host in the inventory:
##   ssh_kex_algorithms    -> KexAlgorithms (e.g. "+diffie-hellman-group1-sha1")
##   ssh_pubkey_algorithms -> HostKeyAlgorithms and PubkeyAcceptedKeyTypes (e.g. "+ssh-rsa")
## The localconfig ssh template uses the same variables.
ansible_ssh_extra_args: >-
  {{ ((['-o KexAlgorithms=' ~ ssh_kex_algorithms] if ssh_kex_algorithms is defined else [])
    + (['-o HostKeyAlgorithms=' ~ ssh_pubkey_algorithms, '-o PubkeyAcceptedKeyTypes=' ~ ssh_pubkey_algorithms]
       if ssh_pubkey_algorithms is defined else []))
    | join(' ') }}
