## Every host gets its IP address as ansible_host, so neither ansible nor the
## generated ssh config (localconfig) depend on a working DNS server.
## Hosts without a known address fall back to <inventory_hostname>.<host_domain>.
[all:vars]
host_domain=realraum.at
ansible_host={{ inventory_hostname }}.{{ host_domain }}
ansible_user=root
ansible_port=22000


